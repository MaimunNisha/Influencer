<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sapana - Influencer Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body, html {
      height: 100%;
      overflow-x: hidden;
    }

    section.hero-section {
      position: relative;
      width: 100%;
      height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .hero-content {
      max-width: 800px;
      padding: 20px;
    }

    .hero-image img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 5px solid #ffc107;
      margin-bottom: 20px;
    }

    .hero-text h1 {
      font-size: 48px;
    }

    .hero-text span {
      color: #ffc107;
    }

    .hero-text h2 {
      font-size: 28px;
      margin-top: 10px;
      height: 40px;
    }

    .hero-text p {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.6;
    }

    .btn-cv {
      display: inline-block;
      margin-top: 25px;
      background: #ffc107;
      color: black;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 600;
      transition: 0.3s ease;
    }

    .btn-cv:hover {
      transform: scale(1.05);
    }

    .hero-socials {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .hero-socials a {
      color: white;
      background: #00000080;
      padding: 10px;
      border-radius: 50%;
      transition: 0.3s;
    }

    .hero-socials a:hover {
      background: #ffc107;
      color: black;
    }

    @media screen and (max-width: 600px) {
      .hero-text h1 {
        font-size: 32px;
      }
      .hero-text h2 {
        font-size: 20px;
      }
      .hero-text p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <section class="hero-section" id="home">
    <video autoplay muted loop playsinline class="background-video">
      <source src="./Protfolio/video/background.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>
    <div class="hero-content" data-aos="fade-up">
      <div class="hero-image">
        <img src="./Protfolio/img/hero/7.jpg" alt="Sapana" />
      </div>
      <div class="hero-text">
        <h1>Hi, I'm <span>Sapana</span></h1>
        <h2><span class="typed-text"></span></h2>
        <p>
          Inspiring 45M+ people with fashion, fitness, technology and travel content. 
          Collaborating with brands to create impactful, authentic storytelling.
        </p>
        <a href="#" class="btn-cv">Download CV</a>
      </div>
      <div class="hero-socials" data-aos="fade-in" data-aos-delay="400">
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fa fa-envelope"></i></a>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    var typed = new Typed('.typed-text', {
      strings: ["Influencer", "Fashion Icon", "Content Creator", "Dream Chaser"],
      typeSpeed: 60,
      backSpeed: 30,
      backDelay: 1500,
      loop: true
    });
  </script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });
  </script>
</body>
</html>
